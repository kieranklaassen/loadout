<!doctype html>

<html lang="en">

  <head>

    <title>Can't reach the server</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-size: clamp(1rem, 2.5vw, 2rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101010;
          color: #e0e0e0;
        }
      }

      a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.0925em;
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main header img {
        height: auto;
        width: min(100%, 6em);
      }

      main article {
        width: min(100%, 30em);
      }

      main article h1 {
        font-size: 125%;
        font-weight: 700;
      }

      main article p {
        font-size: 75%;
      }

    </style>

  </head>

  <body>

    <!--
      This file lives in public/offline.html and is precached by the service
      worker (app/views/pwa/service-worker.js). It is shown for a full-page
      navigation only when the network request itself fails — you are offline,
      or the server is down/restarting (in development: bin/dev is not running).
      Bump CACHE_VERSION in the service worker after editing this file.
    -->

    <main>
      <header>
        <img src="/icon.png" alt="">
      </header>
      <article>
        <h1>Can't reach the server</h1>
        <p>You may be offline, or the server may be restarting.<br>Check your connection and <a href="javascript:location.reload()">try again</a>.</p>
      </article>
    </main>

  </body>

</html>
