# The seeded catalog (Catalog::Sync, run by db:seed and on every deploy).
#
# Keyed by slug. Sync creates missing items and refreshes names, makers, marks,
# and hints on seeded items, but never un-hides an item an admin hid and never
# touches member-suggested items. Members add anything missing while picking.
# Sync never deletes: a kind or item removed here has to be removed by a migration.
#
# mark: the real single-colour mark to show, named by its file in
#   app/frontend/assets/marks/ without the .svg (claude, claudecode, cursor,
#   openai, perplexity, googlegemini, elevenlabs, suno, rive, google). Leave it
#   out and the item shows the first letter of its name in the serif face.
# hue, monogram: legacy columns the app no longer draws. monogram is required;
#   quote it, because YAML reads a bare No, On or Off as a boolean.
# categories: where the item is suggested first in pickers.
# Models: list each family newest first; position within a family is recency.
#   released_on and vibe_check_url (an https link on VIBE_CHECK_HOSTS) are admin-owned:
#   Sync only fills them while they are blank on a model no admin has edited.

