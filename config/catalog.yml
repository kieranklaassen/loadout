  - { slug: writing, name: Writing, blurb: "Drafting, editing, and finding the right words." }
  - { slug: research, name: Research, blurb: "Search, reading, and synthesis." }
  - { slug: classification, name: Classification, blurb: "Labeling, routing, scoring, and extraction at scale." }
  - { slug: image, name: Image, blurb: "Generating and editing images." }
  - { slug: video, name: Video, blurb: "Generating and editing video." }
  - { slug: animation, name: Animation, blurb: "Motion, characters, and moving graphics." }
  - { slug: text-to-speech, name: Text to speech, blurb: "Voices, narration, and dubbing." }
  - { slug: speech-to-text, name: Speech to text, blurb: "Transcription and dictation." }
  - { slug: music, name: Music, blurb: "Songs, scores, and sound." }

