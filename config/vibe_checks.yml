# What Every's Vibe Checks (https://every.to/vibe-check) say each team member used,
# written into their dated history by VibeChecks::Import on every deploy.
#
# Keyed by the member's Every email; `name` is the fallback match against a verified
# @every.to member's name, for when the email here is not the one they sign in with.
# People not in Toolbox yet are skipped until they sign in.
#
# A snapshot is one kind's ranked picks (first pick first, at most three) on the day
# the article came out, and replaces whatever that kind held before. It holds until the
# next snapshot of that kind, the member's own first change in Toolbox, or 90 days.
# `picks: []` means the article says they stopped. tool and model are catalog slugs;
# history-only models are in config/catalog.yml marked `retired`.
#
# Only statements of real use count ("my daily driver", "switched to", "I use it for"),
# never first impressions from testing. `quote` is the line the snapshot rests on, as the
# article has it; a `note` says where the snapshot reads more into it than the quote says,
# usually the tool when the quote names only a model.

