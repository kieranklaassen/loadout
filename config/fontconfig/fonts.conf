<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts for server-rendered images (ProfileCard). The vendored OFL faces in
     vendor/fonts are the source of truth; system fonts only fill in glyphs
     they lack. Paths are relative to this file. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../vendor/fonts</dir>
  <cachedir prefix="relative">../../tmp/cache/fontconfig</cachedir>
</fontconfig>
