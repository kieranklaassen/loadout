# Spans each person shared, matching users.yml: one open period for everyone who
# shares now, none for one and two, and a closed team period for every_cy (hidden today).
ana_team:
  user: every_ana
  level: team
  starts_at: <%= 120.days.ago.to_fs(:db) %>
  ends_at: <%= 90.days.ago.to_fs(:db) %>

ana_link:
  user: every_ana
  level: link
  starts_at: <%= 90.days.ago.to_fs(:db) %>

dee_team:
  user: every_dee
  level: team
  starts_at: <%= 60.days.ago.to_fs(:db) %>

cy_team_past:
  user: every_cy
  level: team
  starts_at: <%= 100.days.ago.to_fs(:db) %>
  ends_at: <%= 50.days.ago.to_fs(:db) %>

eli_link:
  user: outside_eli
  level: link
  starts_at: <%= 45.days.ago.to_fs(:db) %>

fay_link:
  user: every_fay
  level: link
  starts_at: <%= 30.days.ago.to_fs(:db) %>
